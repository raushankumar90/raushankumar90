<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 280" width="410" height="280">
  <style>
    .card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      transition: stroke 0.3s;
    }
    .card:hover {
      stroke: #22c55e;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 600;
      fill: #ffffff;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .domain-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #ffffff;
    }
    .domain-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      fill: #8b949e;
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="409" height="279" rx="8" />
  <text class="text-subtitle" x="20" y="35" fill="#22c55e">CURRENT FOCUS</text>
  <text class="text-title" x="20" y="62">Core Domains</text>
  
  <!-- Domain 1 -->
  <text class="domain-title" x="20" y="98">
    <tspan fill="#22c55e">—</tspan> <tspan fill="#ffffff" dx="6">Distributed Systems</tspan>
  </text>
  <text class="domain-desc" x="38" y="118">Designing message queues and caching layers for scale.</text>
  
  <!-- Domain 2 -->
  <text class="domain-title" x="20" y="158">
    <tspan fill="#ff9933">—</tspan> <tspan fill="#ffffff" dx="6">Cloud Infrastructure</tspan>
  </text>
  <text class="domain-desc" x="38" y="178">Implementing containerized orchestrations and CI/CD.</text>
  
  <!-- Domain 3 -->
  <text class="domain-title" x="20" y="218">
    <tspan fill="#58a6ff">—</tspan> <tspan fill="#ffffff" dx="6">UI Engineering</tspan>
  </text>
  <text class="domain-desc" x="38" y="238">Tuning responsive web interfaces for performance.</text>
</svg>
