<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 170" width="410" height="170">
  <style>
    .card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      transition: stroke 0.3s;
    }
    .card:hover {
      stroke: #58a6ff;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #ffffff;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .badge-bg {
      fill: #0d1117;
      stroke-width: 1px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #c9d1d9;
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="409" height="169" rx="8" />
  <text class="text-subtitle" x="20" y="32" fill="#58a6ff">CLOUD &amp; DEVOPS</text>
  <text class="text-title" x="20" y="52">Infrastructure &amp; Tooling</text>

  <!-- Docker -->
  <g transform="translate(20, 75)">
    <rect class="badge-bg" width="80" height="28" rx="14" stroke="#2496ed" />
    <image href="https://cdn.simpleicons.org/docker" x="8" y="7" width="14" height="14" />
    <text class="badge-text" x="28" y="18">Docker</text>
  </g>
  <!-- Git -->
  <g transform="translate(110, 75)">
    <rect class="badge-bg" width="60" height="28" rx="14" stroke="#f05032" />
    <image href="https://cdn.simpleicons.org/git" x="8" y="7" width="14" height="14" />
    <text class="badge-text" x="28" y="18">Git</text>
  </g>
  <!-- AWS -->
  <g transform="translate(180, 75)">
    <rect class="badge-bg" width="70" height="28" rx="14" stroke="#ff9900" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon@master/icons/amazonwebservices/amazonwebservices-plain-wordmark.svg" x="8" y="7" width="14" height="14" />
    <text class="badge-text" x="28" y="18">AWS</text>
  </g>
  <!-- Linux -->
  <g transform="translate(260, 75)">
    <rect class="badge-bg" width="75" height="28" rx="14" stroke="#fcc624" />
    <image href="https://cdn.simpleicons.org/linux" x="8" y="7" width="14" height="14" />
    <text class="badge-text" x="28" y="18">Linux</text>
  </g>
</svg>
