<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220">
  <style>
    .card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      transition: stroke 0.3s, fill 0.3s;
    }
    .btn {
      fill: #21262d;
      stroke: #30363d;
      stroke-width: 1px;
      transition: fill 0.3s, stroke 0.3s;
    }
    svg:hover .card {
      stroke: #8b949e;
      fill: #1f242c;
    }
    svg:hover .btn {
      fill: #30363d;
      stroke: #8b949e;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #ffffff;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #ffffff;
    }
  </style>
  
  <!-- Card Background -->
  <rect class="card" x="0.5" y="0.5" width="259" height="219" rx="8" />

  <!-- X/Twitter Icon -->
  <g transform="translate(118, 24)">
    <path fill="#ffffff" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
  </g>

  <!-- Card Title -->
  <text class="title" x="130" y="76" text-anchor="middle">Social Media</text>

  <!-- Description (Multi-line) -->
  <text class="desc" x="130" y="100" text-anchor="middle">Tech thoughts, build-in-public,</text>
  <text class="desc" x="130" y="118" text-anchor="middle">and engineering discussions.</text>

  <!-- Button -->
  <rect class="btn" x="40" y="152" width="180" height="34" rx="6" />
  <text class="btn-text" x="130" y="173" text-anchor="middle">Follow →</text>
</svg>
