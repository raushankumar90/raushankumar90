<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 170" width="410" height="170">
  <style>
    .card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      transition: stroke 0.3s;
    }
    .card:hover {
      stroke: #22c55e;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #ffffff;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .badge-bg {
      fill: #0d1117;
      stroke-width: 1px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #c9d1d9;
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="409" height="169" rx="8" />
  <text class="text-subtitle" x="20" y="32" fill="#22c55e">DATABASE</text>
  <text class="text-title" x="20" y="52">Storage, Caching &amp; Querying</text>

  <!-- MongoDB -->
  <g transform="translate(20, 75)">
    <rect class="badge-bg" width="95" height="28" rx="14" stroke="#47a248" />
    <image href="https://cdn.simpleicons.org/mongodb" x="8" y="7" width="14" height="14" />
    <text class="badge-text" x="28" y="18">MongoDB</text>
  </g>
  <!-- PostgreSQL -->
  <g transform="translate(125, 75)">
    <rect class="badge-bg" width="105" height="28" rx="14" stroke="#4169e1" />
    <image href="https://cdn.simpleicons.org/postgresql" x="8" y="7" width="14" height="14" />
    <text class="badge-text" x="28" y="18">PostgreSQL</text>
  </g>
  <!-- Redis -->
  <g transform="translate(240, 75)">
    <rect class="badge-bg" width="75" height="28" rx="14" stroke="#dc382d" />
    <image href="https://cdn.simpleicons.org/redis" x="8" y="7" width="14" height="14" />
    <text class="badge-text" x="28" y="18">Redis</text>
  </g>
</svg>
