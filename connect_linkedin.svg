<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" height="220">
  <style>
    .card {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      transition: stroke 0.3s, fill 0.3s;
    }
    .btn {
      fill: #0077b5;
      transition: fill 0.3s;
    }
    svg:hover .card {
      stroke: #0077b5;
      fill: #1f242c;
    }
    svg:hover .btn {
      fill: #005a87;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #ffffff;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #ffffff;
    }
  </style>
  
  <!-- Card Background -->
  <rect class="card" x="0.5" y="0.5" width="259" height="219" rx="8" />

  <!-- LinkedIn Icon -->
  <g transform="translate(118, 24)">
    <path fill="#0077b5" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
  </g>

  <!-- Card Title -->
  <text class="title" x="130" y="76" text-anchor="middle">Professional Network</text>

  <!-- Description (Multi-line) -->
  <text class="desc" x="130" y="100" text-anchor="middle">Career updates, articles,</text>
  <text class="desc" x="130" y="118" text-anchor="middle">and industry networking.</text>

  <!-- Button -->
  <rect class="btn" x="40" y="152" width="180" height="34" rx="6" />
  <text class="btn-text" x="130" y="173" text-anchor="middle">Connect →</text>
</svg>
